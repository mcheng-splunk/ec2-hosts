on:
  push:
    branches:
      - main
    paths:
      - 'inventories/**'
      - 'roles/**'
      - '*.yml'

  workflow_dispatch:
    inputs:
      target_env:
        description: 'Select Target Environment Scope'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - test
          - prod
      target_tier:
        description: 'Select Infrastructure Tier to Deploy'
        required: true
        default: 'ALL'
        type: choice
        options:
          - db_machines
          - webservers
          - ALL
# ... (Keep your top 'name:' and 'on:' blocks exactly the same) ...

jobs:
  deploy:
    # This exact array block overrides the engine, matching ubuntu-latest 
    # but executing directly on the runner pod's shell.
    runs-on: [ubuntu-latest, host]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y git python3 python3-pip openssh-client ansible

      - name: Configure SSH & Vault Keys
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > .vault_pass.txt
          chmod 600 .vault_pass.txt
          echo "host_key_checking = False" >> ansible.cfg

      - name: Parse Environment and Playbook Selections
        id: parse-matrix
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV_CHOICE="${{ github.event.inputs.target_env }}"
            TIER_CHOICE="${{ github.event.inputs.target_tier }}"
          else
            ENV_CHOICE="dev"
            TIER_CHOICE="ALL"
            echo "Automated git push hook triggered. Defaulting to DEV environment deployment."
          fi

          if [ "$TIER_CHOICE" = "db_machines" ]; then
            PLAYBOOK_FILE="db_machines.yml"
          elif [ "$TIER_CHOICE" = "webservers" ]; then
            PLAYBOOK_FILE="webservers.yml"
          else
            PLAYBOOK_FILE="site.yml"
          fi

          echo "inventory_path=inventories/$ENV_CHOICE/" >> $GITHUB_OUTPUT
          echo "playbook_file=$PLAYBOOK_FILE" >> $GITHUB_OUTPUT

      - name: Execute Targeted Ansible GitOps Playbook
        run: |
          ansible-playbook -i ${{ steps.parse-matrix.outputs.inventory_path }} ${{ steps.parse-matrix.outputs.playbook_file }} --vault-password-file .vault_pass.txt